{{ define "repair_tabs" }}
    <div role="tablist" class="tabs tabs-box w-full sm:w-fit">
        <a role="tab"
           href="{{.URLBase}}repair"
           class="tab {{if eq .Page "repair"}}tab-active{{end}}">
            <i class="bi bi-heart-pulse mr-2"></i>Health checker
        </a>
        <a role="tab"
           href="{{.URLBase}}repair/reacquire"
           class="tab {{if eq .Page "reacquire"}}tab-active{{end}}">
            <i class="bi bi-arrow-repeat mr-2"></i>Arr Reacquisition
        </a>
    </div>
{{ end }}
{{ define "repair_confirm" }}
    <dialog id="repairConfirmModal" class="modal">
        <div class="modal-box max-w-md">
            <p class="whitespace-pre-line" id="repairConfirmMessage"></p>
            <form method="dialog" class="modal-action">
                <button type="submit" value="cancel" class="btn btn-ghost">Cancel</button>
                <button type="submit" value="ok" class="btn btn-primary" id="repairConfirmOk">OK</button>
            </form>
        </div>
        <form method="dialog" class="modal-backdrop">
            <button type="submit" value="cancel">close</button>
        </form>
    </dialog>
{{ end }}
