{{ define "setup_layout" }}
    <!DOCTYPE html>
    <html lang="en" data-theme="dark">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta name="description"
                  content="Decypharr, a debrid and usenet download manager for the arrs">
            <meta name="decypharr-url-base" content="{{.URLBase}}">
            <title>Decypharr - Setup Wizard</title>
            {{template "vite" (viteCSS "pkg/server/ui/styles.css")}}
            <link rel="apple-touch-icon"
                  sizes="180x180"
                  href="{{.URLBase}}images/favicon/apple-touch-icon.png?v={{.AssetVersion}}">
            <link rel="icon"
                  type="image/png"
                  sizes="32x32"
                  href="{{.URLBase}}images/favicon/favicon-32x32.png?v={{.AssetVersion}}">
            <link rel="icon"
                  type="image/png"
                  sizes="16x16"
                  href="{{.URLBase}}images/favicon/favicon-16x16.png?v={{.AssetVersion}}">
            <link rel="manifest"
                  href="{{.URLBase}}images/favicon/site.webmanifest?v={{.AssetVersion}}">
            <script>
        // Early theme detection to prevent FOUC
        (function () {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();

        // Set global URL base
        window.urlBase = "{{.URLBase}}";
            </script>
        </head>
        <body class="min-h-screen bg-base-200">
            <div class="toast-container fixed inset-x-3 bottom-3 z-50 space-y-2 sm:left-auto sm:right-4 sm:w-auto"></div>
            <template id="toast-template">
                <div class="alert mb-2 max-w-full shadow-lg">
                    <div class="flex min-w-0 items-start gap-3">
                        <svg data-type="success"
                             class="w-6 h-6 shrink-0"
                             fill="currentColor"
                             viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                        </svg>
                        <svg data-type="error"
                             class="w-6 h-6 shrink-0"
                             fill="currentColor"
                             viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                        </svg>
                        <svg data-type="warning"
                             class="w-6 h-6 shrink-0"
                             fill="currentColor"
                             viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                        </svg>
                        <svg data-type="info"
                             class="w-6 h-6 shrink-0"
                             fill="currentColor"
                             viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
                        </svg>
                        <div class="min-w-0 flex-1 break-words">
                            <span class="text-sm" data-toast-message></span>
                        </div>
                        <button class="btn btn-sm btn-ghost btn-circle" data-action="close-toast">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                </div>
            </template>
            {{ template "setup" . }}
            <script src="{{.URLBase}}assets/js/common.js?v={{.AssetVersion}}"></script>
            <script src="{{.URLBase}}assets/js/setup.js?v={{.AssetVersion}}"></script>
        </body>
    </html>
{{ end }}
