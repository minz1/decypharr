{{ define "setup_layout" }}
    <!DOCTYPE html>
    <html lang="en" data-theme="dark">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta name="description"
                  content="Decypharr, a debrid and usenet download manager for the arrs">
            <meta name="decypharr-url-base" content="{{.URLBase}}">
            <title>Decypharr - Setup Wizard</title>
            {{template "vite" (viteCSS "pkg/server/ui/styles.css")}}
            <link rel="apple-touch-icon"
                  sizes="180x180"
                  href="{{.URLBase}}images/favicon/apple-touch-icon.png?v={{.AssetVersion}}">
            <link rel="icon"
                  type="image/png"
                  sizes="32x32"
                  href="{{.URLBase}}images/favicon/favicon-32x32.png?v={{.AssetVersion}}">
            <link rel="icon"
                  type="image/png"
                  sizes="16x16"
                  href="{{.URLBase}}images/favicon/favicon-16x16.png?v={{.AssetVersion}}">
            <link rel="manifest"
                  href="{{.URLBase}}images/favicon/site.webmanifest?v={{.AssetVersion}}">
            {{ template "theme_script" }}
            {{ template "vite" (viteEntry "pkg/server/ui/pages/layout.ts") }}
        </head>
        <body class="min-h-screen bg-base-200">
            <div class="toast-container fixed inset-x-3 bottom-3 z-50 space-y-2 sm:left-auto sm:right-4 sm:w-auto"></div>
            {{ template "layout_templates" }}
            {{ template "setup" . }}
        </body>
    </html>
{{ end }}
