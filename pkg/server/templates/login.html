{{ define "login" }}
    <div class="flex w-full items-center justify-center bg-base-200">
        <div class="card w-full max-w-sm bg-base-100 shadow-xl">
            <div class="card-body">
                <h2 class="card-title justify-center mb-6">Login</h2>
                <form id="loginForm" class="space-y-4">
                    {{ if .TokenOnly }}
                        <div>
                            <label class="label" for="password">
                                <span>API Token</span>
                            </label>
                            <input type="password"
                                   class="input w-full"
                                   id="password"
                                   name="password"
                                   required>
                            <span class="text-sm opacity-70">This instance uses token-only authentication. Paste the API
                            token from your config file (data/auth.json) or the API_TOKEN environment variable.</span>
                        </div>
                    {{ else }}
                        <div>
                            <label class="label" for="username">
                                <span>Username</span>
                            </label>
                            <input type="text"
                                   class="input w-full"
                                   id="username"
                                   name="username"
                                   required>
                        </div>
                        <div>
                            <label class="label" for="password">
                                <span>Password</span>
                            </label>
                            <input type="password"
                                   class="input w-full"
                                   id="password"
                                   name="password"
                                   required>
                        </div>
                    {{ end }}
                    <div class="mt-6">
                        <button type="submit" class="btn btn-primary w-full">Login</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    {{ template "vite" (viteEntry "pkg/server/ui/pages/login.ts") }}
{{ end }}
